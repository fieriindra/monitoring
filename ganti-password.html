<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e14">
  <title>Ganti Password — Monitoring</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
  <main class="login">
    <a class="brand" href="/menu" aria-label="Monitoring">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h4l2.5-7 5 14 2.5-7h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Monitoring
    </a>
    <h1>Ganti password</h1>
    <p class="subtitle">Masukkan kata sandi saat ini, lalu tentukan kata sandi baru.</p>

    <form id="password-form">
      <div class="field">
        <label for="current-password">Kata sandi saat ini</label>
        <input id="current-password" name="current_password" type="password" placeholder="Masukkan kata sandi saat ini" autocomplete="current-password" required>
      </div>

      <div class="field">
        <label for="new-password">Kata sandi baru</label>
        <input id="new-password" name="new_password" type="password" placeholder="8-72 karakter" autocomplete="new-password" required>
      </div>

      <div class="field">
        <label for="confirm-password">Ulangi kata sandi baru</label>
        <input id="confirm-password" name="confirm_password" type="password" placeholder="Ulangi kata sandi baru" autocomplete="new-password" required>
      </div>

      <button class="submit" type="submit">Simpan</button>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
    </form>

    <div class="options">
      <a class="forgot" href="/menu">Kembali ke menu</a>
    </div>
    <p class="footer">Akses khusus untuk pengguna terotorisasi</p>
  </main>

  <script>
    const passwordForm = document.querySelector("#password-form");
    const formMessage = document.querySelector("#form-message");
    const submitButton = passwordForm.querySelector(".submit");

    passwordForm.addEventListener("submit", (event) => {
      event.preventDefault();
      formMessage.textContent = "";
      formMessage.style.color = "#ff8b95";

      const currentPassword = passwordForm.elements.current_password.value;
      const newPassword = passwordForm.elements.new_password.value;
      const confirmPassword = passwordForm.elements.confirm_password.value;

      if (newPassword !== confirmPassword) {
        formMessage.textContent = "Konfirmasi kata sandi baru tidak cocok.";
        return;
      }
      const newBytes = new TextEncoder().encode(newPassword).length;
      if (newBytes < 8 || newBytes > 72) {
        formMessage.textContent = "Kata sandi baru harus 8-72 karakter.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Menyimpan...";

      fetch("/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
          current_password: currentPassword,
          new_password: newPassword
        })
      })
        .then(async (response) => {
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || `Gagal menyimpan (HTTP ${response.status}).`);
          passwordForm.reset();
          formMessage.style.color = "#61d78a";
          formMessage.textContent = result.message || "Kata sandi berhasil diganti.";
        })
        .catch((error) => {
          formMessage.style.color = "#ff8b95";
          formMessage.textContent = error instanceof TypeError
            ? "Server tidak dapat dihubungi."
            : error.message;
        })
        .finally(() => {
          submitButton.disabled = false;
          submitButton.textContent = "Simpan";
        });
    });
  </script>
</body>
</html>
